# Configuración de la base de datos de VitaHealth
#
# Opción 1 (por defecto): H2 embebido en modo PostgreSQL. Se crea solo en la carpeta del usuario.
db.driver=org.h2.Driver
db.url=jdbc:h2:file:${user.home}/vitahealth-db/vitahealth_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
db.usuario=sa
db.clave=
#
# Opción 2: PostgreSQL (script en database/vitahealth_postgresql.sql)
